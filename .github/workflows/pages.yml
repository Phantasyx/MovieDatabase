name: Publish demo

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "marquee/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build Marquee
        run: sh marquee/build.sh
      - name: Upload Marquee
        uses: actions/upload-pages-artifact@v3
        with:
          path: marquee/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
